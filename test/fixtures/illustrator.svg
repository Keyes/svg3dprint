<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 100" width="200" height="100">
  <defs>
    <style>
      .cls-1 { fill: #e11d48; }
      .cls-2 { fill: none; stroke: #0f172a; stroke-width: 4px; stroke-linecap: round; }
      g.badge > .cls-3 { fill: rgb(16, 185, 129); }
      #star { fill: gold }
    </style>
    <clipPath id="clip"><rect x="10" y="10" width="60" height="40"/></clipPath>
    <symbol id="dot" viewBox="0 0 10 10"><circle cx="5" cy="5" r="5"/></symbol>
    <linearGradient id="grad"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  </defs>
  <rect class="cls-1" x="0" y="0" width="200" height="100"/>
  <g clip-path="url(#clip)"><circle cx="40" cy="30" r="35" fill="#fff"/></g>
  <g class="badge" transform="translate(100 10)">
    <rect class="cls-3" width="40" height="40" rx="8"/>
    <polygon id="star" points="20,5 24,16 36,16 26,23 30,35 20,28 10,35 14,23 4,16 16,16"/>
  </g>
  <path class="cls-2" d="M10 80 Q 50 60 90 80 T 170 80"/>
  <use xlink:href="#dot" x="150" y="15" width="20" height="20" fill="#0f172a"/>
  <rect x="150" y="45" width="40" height="10" fill="url(#grad)"/>
  <rect x="0" y="0" width="5" height="5" fill="#000" mask="url(#m)" style="display:none"/>
</svg>

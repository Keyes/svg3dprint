name: Bug report
description: An SVG comes out wrong, the CLI fails, or the library throws
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what you got. A screenshot of the slicer helps.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or code
      description: The svg3dprint command or build() options you used.
      render: shell
    validations:
      required: true
  - type: textarea
    id: svg
    attributes:
      label: SVG
      description: Attach the SVG (or a cut-down version that still shows the problem). Only share files you're allowed to share.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions
      description: svg3dprint version, Node version or browser, OS
      placeholder: svg3dprint 0.1.0, Node 24, macOS
    validations:
      required: true
